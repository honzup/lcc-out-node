; LCC 13-output "effects" node — OpenMRNLite (LCC/OpenLCB).
; Outputs only: 13 GPIOs, per-output effect (Off/Steady/Random/Flicker).
; Toolchain pinned:
;   arduino-esp32 = espressif32@6.9.0 (2.0.x), OpenMRNLite v2.0.0, gnu++17.
; Do NOT bump OpenMRNLite to v2.2.x without code changes: it removes the
; Esp32HardwareTwai driver this firmware uses.
;   Build:  pio run
[env:esp32_omrn]
platform = espressif32@6.9.0
board = esp32dev                            ; ESP32 WROVER-class DevKit
framework = arduino
monitor_speed = 115200
upload_speed = 115200                       ; CP2102 boards won't sync at the default rate
board_build.partitions = min_spiffs.csv     ; CDI/config stored in SPIFFS
lib_deps =
    https://github.com/openmrn/OpenMRNLite.git#v2.0.0
    tzapu/WiFiManager@^2.0.17               ; WiFi provisioning for OTA only
build_flags =
    -std=gnu++17
build_unflags = -std=gnu++11

; OTA over WiFi — after firing WiFi-ON from JMRI:  pio run -e esp32_omrn_ota -t upload
[env:esp32_omrn_ota]
extends = env:esp32_omrn
upload_protocol = espota
; upload_port = <node-ip>       ; or pass --upload-port <ip>
